<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>股票演算法測試頁</title>
  <link rel="stylesheet" href="testing-page.css?v=2.3.15">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>🧪 股票演算法測試頁</h1>
      <p class="subtitle">手動試齊 StockPulse 全部演算法, 揀股票 + 填參數 + 撳「跑算法」即出結果</p>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <section class="algo-selector">
          <h2>揀演算法</h2>
          <select id="algorithm-select">
            <option value="">載入中...</option>
          </select>
        </section>

        <section class="tools-section">
          <h2>🛠️ 工具</h2>
          <a href="paper-trading-sim.html" class="tool-link">📋 Paper Trading Sim</a>
        </section>

        <section class="algo-info" id="algo-info">
          <p style="color: #888;">揀咗演算法就會見到呢度嘅介紹</p>
        </section>

        <section class="help" id="algo-help"></section>
      </aside>

      <main class="main">
        <section class="inputs">
          <h2>輸入參數</h2>
          <form id="inputs-form" onsubmit="return false;"></form>
          <button id="run-btn" class="primary-btn">跑算法</button>
          <div id="run-status" class="run-status"></div>
        </section>

        <section class="result">
          <h2>結果</h2>
          <div id="result-panel">
            <p style="color: #888;">填好輸入參數, 撳「跑算法」就會見到結果</p>
          </div>
        </section>

        <section class="chart-section">
          <div class="chart-header">
            <h2>📈 股票 K 線圖</h2>
            <p class="chart-note">
              撳完「跑算法」之後, 嗰隻股票嘅 K 線圖會自動顯示喺呢度。
            </p>
          </div>
          <div id="chart-container"></div>
        </section>
      </main>
    </div>

    <footer class="footer">
      <small>
        🛠️ StockPulse 測試頁框架 · 總共 <span id="registry-count">0</span> 個演算法 · 
        <a href="REGISTRY.md">REGISTRY.md</a>
      </small>
    </footer>
  </div>

  <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
  <script type="module" src="testing-page.js?v=2.3.38"></script>
</body>
</html>
